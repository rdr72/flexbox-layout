<!DOCTYPE html>
<html lang="en">  
<head>
  <meta charset="utf-8">
  <title>Flexbox Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
</head>
<body>
<!-- top section -->
<div class="header">
    <div class="action">
      <h1>Welcome to</h1>
      <h2>THE POINTLESS BUTTON</h2>
      <h3>Click the button below to see what happens. It doesn't do anything, but it looks cool</h3>
      <div class="red-button">
      <a href="#" class="button button-primary">Click me</a>
      </div>
    </div>
  </div>
</div>
<!-- info section -->
<div class="info">
  <div class="section">
    <button onclick="countClicks()">Click Me</button>
<p id="myText">Click me.</p>
  
    <script>
  let clickCount = 0;

  function countClicks() {
    clickCount++;

    if (clickCount === 3) {
      document.getElementById("myText").innerText = "You clicked three times!";
    } else if (clickCount === 5) {
      document.getElementById("myText").innerText = "Amazing! Five clicks!";
    } else if (clickCount > 5) {
      document.getElementById("myText").innerText = "That is enough clicking!";
    } else {
      document.getElementById("myText").innerText = "Clicks: " + clickCount;
    }
  }
</script>
  </div>
  <div class="section boxes">
  </div>
</div>
</body>
</html>
